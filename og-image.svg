<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" style="stop-color:#c4571a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0c0b09;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" style="stop-color:#c4571a;stop-opacity:0.3"/>
      <stop offset="30%" style="stop-color:#8b3a0e;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0c0b09;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0c0b09"/>
  <!-- Flame glow at bottom -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="380" width="1200" height="250" fill="url(#flame)"/>
  <!-- Ember dots -->
  <circle cx="200" cy="520" r="2" fill="#df6824" opacity="0.6"/>
  <circle cx="350" cy="480" r="1.5" fill="#f59542" opacity="0.4"/>
  <circle cx="500" cy="540" r="2.5" fill="#c4571a" opacity="0.5"/>
  <circle cx="650" cy="500" r="1.8" fill="#df6824" opacity="0.7"/>
  <circle cx="780" cy="530" r="2" fill="#f59542" opacity="0.5"/>
  <circle cx="900" cy="490" r="1.5" fill="#c4571a" opacity="0.6"/>
  <circle cx="1020" cy="520" r="2.2" fill="#df6824" opacity="0.4"/>
  <circle cx="150" cy="460" r="1.2" fill="#f59542" opacity="0.3"/>
  <circle cx="450" cy="470" r="1.8" fill="#c4571a" opacity="0.4"/>
  <circle cx="720" cy="550" r="1.5" fill="#df6824" opacity="0.5"/>
  <circle cx="1050" cy="470" r="1.3" fill="#f59542" opacity="0.3"/>
  <circle cx="300" cy="550" r="2" fill="#c4571a" opacity="0.4"/>
  <circle cx="850" cy="560" r="1.8" fill="#df6824" opacity="0.3"/>
  <circle cx="550" cy="510" r="1.2" fill="#f59542" opacity="0.5"/>
  <circle cx="980" cy="545" r="2.5" fill="#c4571a" opacity="0.35"/>
  <!-- Eyebrow text -->
  <text x="600" y="230" text-anchor="middle" font-family="'IBM Plex Mono','Courier New',monospace" font-size="18" font-weight="300" letter-spacing="4" fill="#df6824" text-transform="uppercase">BURN THE NOISE. KEEP THE SIGNAL.</text>
  <!-- BURNPILES wordmark -->
  <text x="600" y="340" text-anchor="middle" font-family="'IBM Plex Mono','Courier New',monospace" font-size="96" font-weight="300" letter-spacing="20" fill="#eee8dc">BURNPILES</text>
  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="'IBM Plex Mono','Courier New',monospace" font-size="16" font-weight="300" letter-spacing="2" fill="#8a8170">We know what to burn.</text>
  <!-- Bottom accent line -->
  <rect x="400" y="580" width="400" height="1" fill="#c4571a" opacity="0.3"/>
</svg>
