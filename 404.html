<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Burnpiles</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0c0b09;
      color: #eee8dc;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }
    canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .content { position: relative; z-index: 2; }
    .code {
      font-family: 'Inter', sans-serif;
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: rgba(238, 232, 220, 0.08);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 300;
      margin-bottom: 0.8rem;
      color: #eee8dc;
    }
    .sub {
      font-size: clamp(0.8rem, 1.5vw, 0.95rem);
      font-weight: 300;
      color: rgba(238, 232, 220, 0.5);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .sub strong { color: #df6824; font-weight: 400; }
    .btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      border: 1px solid rgba(196, 87, 26, 0.4);
      color: #df6824;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .btn:hover {
      background: rgba(196, 87, 26, 0.1);
      border-color: #df6824;
      color: #eee8dc;
    }
    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(238, 232, 220, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <div class="code">404</div>
    <h1 class="heading">Nothing here but noise.</h1>
    <p class="sub">The page you're looking for doesn't exist.<br>Let's get you back to the <strong>signal</strong>.</p>
    <a href="/" class="btn">Back to Burnpiles</a>
  </div>
  <div class="footer">Burnpiles — burn the noise. Keep the signal.</div>

  <script>
    // Minimal ember system for 404
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const embers = [];
    for (let i = 0; i < 60; i++) {
      embers.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        vy: -(Math.random() * 0.4 + 0.15),
        vx: (Math.random() - 0.5) * 0.2,
        osc: Math.random() * Math.PI * 2,
        oSpd: Math.random() * 0.02 + 0.005,
        alp: Math.random() * 0.4 + 0.1,
        life: Math.random() * 200,
        max: Math.random() * 200 + 80,
      });
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);

      // Subtle bottom glow
      const g = ctx.createLinearGradient(0, H, 0, H * 0.7);
      g.addColorStop(0, 'rgba(140, 40, 5, 0.08)');
      g.addColorStop(1, 'rgba(100, 20, 2, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, H * 0.7, W, H * 0.3);

      embers.forEach(e => {
        e.osc += e.oSpd;
        e.y += e.vy;
        e.x += e.vx + Math.sin(e.osc) * 0.15;
        e.life++;
        const fade = e.alp * (1 - Math.pow(e.life / e.max, 1.8));
        if (e.life >= e.max || e.y < -8) {
          e.x = Math.random() * W;
          e.y = H + 10;
          e.life = 0;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, fade);
        const gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 3);
        gr.addColorStop(0, 'rgba(220, 90, 15, 0.7)');
        gr.addColorStop(0.4, 'rgba(180, 50, 8, 0.2)');
        gr.addColorStop(1, 'rgba(150, 40, 5, 0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 210, 100, 0.9)';
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
